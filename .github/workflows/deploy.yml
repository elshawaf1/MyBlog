name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Private vault checkout (optional): builds the public blog from real
      # published notes when VAULT_TOKEN secret exists; else seed content.
      - name: Checkout private vault (optional)
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          if [ -n "$VAULT_TOKEN" ]; then
            git clone --depth 1 "https://x-access-token:${VAULT_TOKEN}@github.com/elshawaf1/MyVault.git" vault-content
            ls vault-content/notes
          else
            echo "No VAULT_TOKEN secret — building from content/seed."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
